services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - dook-data:/data
    environment:
      - OWNER_ACTIVATION_TOKEN=${OWNER_ACTIVATION_TOKEN}
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID}
    restart: unless-stopped

  backup:
    build: .
    volumes:
      - dook-data:/data
      - ./backups:/backups
    environment:
      - DB_PATH=/data/dook.sqlite
      - MEDIA_PATH=/data/media
      - BACKUP_DIR=/backups
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
    entrypoint: ["node", "scripts/backup-loop.mjs"]
    restart: unless-stopped

volumes:
  dook-data:
