services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - dook-data:/data
    environment:
      - OWNER_ACTIVATION_TOKEN=${OWNER_ACTIVATION_TOKEN}
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    restart: unless-stopped

volumes:
  dook-data:
